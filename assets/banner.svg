<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" fill="none" viewBox="0 0 1000 260"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#FFF000"/><stop offset="50%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#9d4edd"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="badgeGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.18) translate(-15px,10px);opacity:.45}}@keyframes pulseDuck{0%{transform:scale(1) translate(0,0);opacity:.2}50%{transform:scale(1.25) translate(20px,-15px);opacity:.4}}@keyframes waveFlow{0%{stroke-dashoffset:0}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pillFloat3{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:38px;fill:#fff;letter-spacing:-.5px}.duckdb-highlight{fill:#fff000}.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.pill-text{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;Courier New&apos;,monospace;font-size:12px;font-weight:700;fill:#e2e8f0}.code-text{font-family:&apos;JetBrains Mono&apos;,monospace;font-size:13px;fill:#38bdf8}.orb-cyan,.orb-yellow{animation:pulseOrb 8s ease-in-out infinite;transform-origin:center}.orb-yellow{animation:pulseDuck 9s ease-in-out infinite}.stream-line{stroke-dasharray:12 16;animation:waveFlow 14s linear infinite}.pill-group-1{animation:pillFloat1 4.5s ease-in-out infinite}.pill-group-2{animation:pillFloat2 5.2s ease-in-out infinite .7s}.pill-group-3{animation:pillFloat3 4.8s ease-in-out infinite 1.3s}</style><rect width="1000" height="260" fill="url(#bgGrad)" rx="16"/><rect width="998" height="258" x="1" y="1" stroke="url(#accentGrad)" stroke-opacity=".4" stroke-width="1.5" rx="15"/><g><circle cx="880" cy="70" r="130" fill="#0284c7" class="orb-cyan" filter="url(#glow)"/><circle cx="120" cy="200" r="110" fill="#eab308" class="orb-yellow" filter="url(#glow)"/><circle cx="500" cy="240" r="100" fill="#7c3aed" class="orb-cyan" filter="url(#glow)"/></g><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M-50,60 C 250,140 450,-20 750,70 C 900,110 1050,40 1150,80" class="stream-line"/><path fill="none" stroke="#FFF000" stroke-width="2" d="M-50,190 C 200,100 420,240 700,160 C 880,110 1020,200 1150,180" class="stream-line"/></g><g transform="translate(730, 35)"><rect width="235" height="185" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" rx="12"/><circle cx="20" cy="18" r="4.5" fill="#ef4444"/><circle cx="36" cy="18" r="4.5" fill="#f59e0b"/><circle cx="52" cy="18" r="4.5" fill="#10b981"/><text x="75" y="22" fill="#64748b" font-family="monospace" font-size="11">duckdb &amp; sql-cli</text><line x1="0" x2="235" y1="34" y2="34" stroke="#1e293b" stroke-width="1"/><text x="18" y="60" fill="#38bdf8" class="code-text">❯ duckdb local.db</text><text x="18" y="82" fill="#a7f3d0" font-family="monospace" font-size="11">SELECT</text><text x="65" y="82" fill="#94a3b8" font-family="monospace" font-size="11">* FROM</text><text x="110" y="82" fill="#fde047" font-family="monospace" font-size="11">&apos;fast.parquet&apos;</text><text x="18" y="104" fill="#a7f3d0" font-family="monospace" font-size="11">SUMMARIZE;</text><rect width="200" height="42" x="18" y="125" fill="#0b1329" stroke="#1e293b" rx="6"/><text x="28" y="143" fill="#64748b" font-family="monospace" font-size="10">STATUS: CONNECTED</text><text x="28" y="157" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">⚡ 10M rows in 12ms</text></g><g><g transform="translate(50, 0) translate(0, 38)"><rect width="180" height="26" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" rx="13"/><text x="14" y="17" fill="#60a5fa" class="pill-text">⚡ AWESOME LIST 2026</text></g><text x="0" y="102" class="title-text" transform="translate(50, 0)">Terminal SQL IDE &amp; <tspan class="duckdb-highlight">DuckDB</tspan> Clients</text><text x="0" y="134" class="subtitle-text" transform="translate(50, 0)">Curated ecosystem of fast TUIs, local-first analytics tools, CLI interfaces &amp; database platforms</text><g><g class="pill-group-1" transform="translate(50, 0) translate(0, 168) translate(0, 0)"><rect width="138" height="34" fill="#1e293b" stroke="#FFF000" stroke-opacity=".8" stroke-width="1.2" rx="8"/><circle cx="18" cy="17" r="5" fill="#FFF000"/><text x="32" y="22" fill="#FFF000" class="pill-text">DuckDB Core</text></g><g class="pill-group-2" transform="translate(50, 0) translate(0, 168) translate(150, 0)"><rect width="158" height="34" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.2" rx="8"/><circle cx="18" cy="17" r="5" fill="#38bdf8"/><text x="32" y="22" fill="#38bdf8" class="pill-text">Terminal TUIs</text></g><g class="pill-group-3" transform="translate(50, 0) translate(0, 168) translate(320, 0)"><rect width="168" height="34" fill="#1e293b" stroke="#a855f7" stroke-opacity=".8" stroke-width="1.2" rx="8"/><circle cx="18" cy="17" r="5" fill="#a855f7"/><text x="32" y="22" fill="#c084fc" class="pill-text">Local-First SQL</text></g><g class="pill-group-1" transform="translate(50, 0) translate(0, 168) translate(500, 0)"><rect width="145" height="34" fill="#1e293b" stroke="#10b981" stroke-opacity=".8" stroke-width="1.2" rx="8"/><circle cx="18" cy="17" r="5" fill="#10b981"/><text x="32" y="22" fill="#34d399" class="pill-text">Open-Source</text></g></g></g></svg>