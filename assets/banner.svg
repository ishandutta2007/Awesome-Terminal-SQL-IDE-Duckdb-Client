<svg fill="none" viewBox="0 0 1000 260" width="1000" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF000"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .duckdb-highlight {
      fill: #FFF000;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #38bdf8;
    }

    /* Dynamic / Animated elements running smoothly in background */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.45; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
    }

    @keyframes pulseDuck {
      0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
      50% { transform: scale(1.25) translate(20px, -15px); opacity: 0.4; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.2; }
    }

    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -320; }
    }

    @keyframes pillFloat1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pillFloat2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pillFloat3 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    .orb-cyan {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }

    .orb-yellow {
      animation: pulseDuck 9s ease-in-out infinite;
      transform-origin: center;
    }

    .stream-line {
      stroke-dasharray: 12 16;
      animation: waveFlow 14s linear infinite;
    }

    .pill-group-1 { animation: pillFloat1 4.5s ease-in-out infinite; }
    .pill-group-2 { animation: pillFloat2 5.2s ease-in-out infinite 0.7s; }
    .pill-group-3 { animation: pillFloat3 4.8s ease-in-out infinite 1.3s; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="258" x="1" y="1" rx="15" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Ambient Glow Orbs (Positioned safely behind text) -->
  <g>
    <circle class="orb-cyan" cx="880" cy="70" r="130" fill="#0284c7" filter="url(#glow)"/>
    <circle class="orb-yellow" cx="120" cy="200" r="110" fill="#eab308" filter="url(#glow)"/>
    <circle class="orb-cyan" cx="500" cy="240" r="100" fill="#7c3aed" filter="url(#glow)"/>
  </g>

  <!-- Subtle Dynamic Wave Grid (Background) -->
  <g opacity="0.25">
    <path class="stream-line" d="M-50,60 C 250,140 450,-20 750,70 C 900,110 1050,40 1150,80" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path class="stream-line" d="M-50,190 C 200,100 420,240 700,160 C 880,110 1020,200 1150,180" fill="none" stroke="#FFF000" stroke-width="2"/>
  </g>

  <!-- Subtle Terminal Grid Accent (Right Side Decorative Card) -->
  <g transform="translate(730, 35)">
    <rect width="235" height="185" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <!-- Terminal Header dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981"/>
    <text x="75" y="22" font-family="monospace" font-size="11" fill="#64748b">duckdb &amp; sql-cli</text>
    <line x1="0" y1="34" x2="235" y2="34" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Code snippets inside decorative card -->
    <text x="18" y="60" class="code-text" fill="#38bdf8">❯ duckdb local.db</text>
    <text x="18" y="82" font-family="monospace" font-size="11" fill="#a7f3d0">SELECT</text>
    <text x="65" y="82" font-family="monospace" font-size="11" fill="#94a3b8">* FROM</text>
    <text x="110" y="82" font-family="monospace" font-size="11" fill="#fde047">'fast.parquet'</text>
    <text x="18" y="104" font-family="monospace" font-size="11" fill="#a7f3d0">SUMMARIZE;</text>

    <!-- Mini stats bar inside card -->
    <rect x="18" y="125" width="200" height="42" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="28" y="143" font-family="monospace" font-size="10" fill="#64748b">STATUS: CONNECTED</text>
    <text x="28" y="157" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">⚡ 10M rows in 12ms</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, and Interactive Feature Pills (Guaranteed unobstructed visibility) -->
  <g transform="translate(50, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 38)">
      <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="14" y="17" class="pill-text" fill="#60a5fa">⚡ AWESOME LIST 2026</text>
    </g>

    <!-- Primary Title -->
    <text x="0" y="102" class="title-text">
      Terminal SQL IDE &amp; <tspan class="duckdb-highlight">DuckDB</tspan> Clients
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="134" class="subtitle-text">
      Curated ecosystem of fast TUIs, local-first analytics tools, CLI interfaces &amp; database platforms
    </text>

    <!-- Interactive / Dynamic Feature Pills in Foreground -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: DuckDB -->
      <g class="pill-group-1" transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#FFF000" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="17" r="5" fill="#FFF000"/>
        <text x="32" y="22" class="pill-text" fill="#FFF000">DuckDB Core</text>
      </g>

      <!-- Pill 2: Terminal TUIs -->
      <g class="pill-group-2" transform="translate(150, 0)">
        <rect width="158" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
        <text x="32" y="22" class="pill-text" fill="#38bdf8">Terminal TUIs</text>
      </g>

      <!-- Pill 3: Local-First SQL -->
      <g class="pill-group-3" transform="translate(320, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="17" r="5" fill="#a855f7"/>
        <text x="32" y="22" class="pill-text" fill="#c084fc">Local-First SQL</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g class="pill-group-1" transform="translate(500, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="17" r="5" fill="#10b981"/>
        <text x="32" y="22" class="pill-text" fill="#34d399">Open-Source</text>
      </g>
    </g>
  </g>
</svg>
